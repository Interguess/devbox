name: Block direct pull requests to main

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: block-prs-to-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-branch:
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        uses: actions/github-script@v7
        with:
          script: |
            const source = context.payload.pull_request.head.ref;
            if (source !== "develop") {
              core.setFailed(`Pull requests to ‘main’ are only allowed from ‘develop’. Current source branch: '${source}'.`);
            } else {
              core.notice(`OK: Source-Branch ist '${source}'.`);
            }