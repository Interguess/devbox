name: Analyze codestyle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Grant execute permission to Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run Checkstyle (modern action)
        uses: dbelyaev/action-checkstyle@v1.22.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: '.github/config/checkstyle.xml'
          checkstyle_version: '11.0.0'
          reporter: github-pr-check
          level: error

      - name: Run PMD (all modules)
        uses: pmd/pmd-github-action@v2
        with:
          rulesets: '.github/config/pmd.xml'
